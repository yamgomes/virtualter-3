<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>Virtualter 3</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: #000;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      }
      canvas {
        position: absolute;
        top: 0; left: 0;
      }

      /* Game Selection Screen */
      #game-selection {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 1000;
        color: white;
      }

      .selection-header {
        text-align: center;
        margin-bottom: 40px;
      }

      .selection-header h1 {
        font-size: 3em;
        margin: 0 0 10px 0;
        text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
      }

      .selection-header p {
        font-size: 1.2em;
        margin: 0;
        opacity: 0.9;
      }

      .games-container {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
        gap: 20px;
        max-width: 1200px;
        width: 90%;
        margin-bottom: 30px;
      }

      .game-card {
        background: rgba(255, 255, 255, 0.1);
        border-radius: 15px;
        padding: 25px;
        cursor: pointer;
        transition: all 0.3s ease;
        border: 2px solid transparent;
        backdrop-filter: blur(10px);
      }

      .game-card:hover {
        transform: translateY(-5px);
        background: rgba(255, 255, 255, 0.2);
        border-color: rgba(255, 255, 255, 0.3);
        box-shadow: 0 10px 30px rgba(0,0,0,0.2);
      }

      .game-card.selected {
        border-color: #4CAF50;
        background: rgba(76, 175, 80, 0.2);
      }

      .game-title {
        font-size: 1.5em;
        font-weight: bold;
        margin-bottom: 10px;
        color: #fff;
      }

      .game-description {
        font-size: 1em;
        margin-bottom: 15px;
        opacity: 0.9;
        line-height: 1.4;
      }

      .game-meta {
        display: flex;
        justify-content: space-between;
        font-size: 0.9em;
        opacity: 0.8;
      }

      .game-category {
        background: rgba(255, 255, 255, 0.2);
        padding: 4px 8px;
        border-radius: 12px;
        font-size: 0.8em;
      }

      .game-difficulty {
        font-weight: bold;
      }

      .difficulty-easy { color: #4CAF50; }
      .difficulty-medium { color: #FF9800; }
      .difficulty-hard { color: #F44336; }

      .start-button {
        background: linear-gradient(45deg, #4CAF50, #45a049);
        color: white;
        border: none;
        padding: 15px 40px;
        font-size: 1.2em;
        border-radius: 25px;
        cursor: pointer;
        transition: all 0.3s ease;
        box-shadow: 0 4px 15px rgba(76, 175, 80, 0.3);
        text-transform: uppercase;
        font-weight: bold;
        letter-spacing: 1px;
      }

      .start-button:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(76, 175, 80, 0.4);
      }

      .start-button:disabled {
        background: #666;
        cursor: not-allowed;
        transform: none;
        box-shadow: none;
      }

      .hidden {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <!-- Game Selection Screen -->
    <div id="game-selection">
      <div class="selection-header">
        <h1>Virtualter 3</h1>
        <p>Escolha um jogo para começar sua sessão de exercícios</p>
      </div>

      <div class="games-container" id="games-container">
        <!-- Games will be loaded dynamically -->
      </div>

      <button class="start-button" id="start-game-btn" disabled>
        Começar Jogo
      </button>
    </div>

    <!-- Game Header (shown during gameplay) -->
    <div id="game-header" class="hidden" style="position:fixed;top:0;left:0;width:100vw;height:60px;background:#111;color:#fff;display:flex;align-items:center;justify-content:center;font-size:1.5em;z-index:300;pointer-events:none;box-shadow:0 2px 8px #000;">
      <span id="game-title">Virtualter 3</span>
    </div>

    <script type="module" src="src/main.ts"></script>
  </body>
</html>
